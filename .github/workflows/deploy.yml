name: CI/CD Pipeline

on:
  push:
    branches:
      - main

jobs:
  build:
    name: Build & Test
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Cài đặt thư viện (Install Dependencies)
        run: npm ci

      - name: Kiểm tra cú pháp (Syntax Lint)
        run: node -c server.js

  deploy:
    name: Deploy to VPS
    needs: build
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Truyền Code lên VPS qua SCP
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.SERVER_HOST }}
          username: ${{ secrets.SERVER_USERNAME }}
          password: ${{ secrets.SERVER_PASSWORD }}
          port: 3232
          source: "."
          target: "/home/minhhan/pwd"
          rm: false
          exclude: ".git,.github,node_modules,database.db,secret.key,.env,update.sh,clear.sh,README.md"

      - name: Cài đặt thư viện Production & Khởi động lại
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.SERVER_HOST }}
          username: ${{ secrets.SERVER_USERNAME }}
          password: ${{ secrets.SERVER_PASSWORD }}
          port: 3232
          script: |
            cd /home/minhhan/pwd
            npm ci --production
            pm2 restart pwd-mgn

      - name: Discord Notification
        if: always()
        env:
          COMMIT_MSG: ${{ github.event.head_commit.message }}
        run: |
          if [ "${{ job.status }}" = "success" ]; then
            COLOR=3066993
            TITLE="✅ Trạng thái Deploy (CI/CD Hoàn chỉnh)"
          else
            COLOR=15158332
            TITLE="❌ Trạng thái Deploy (Lỗi CI/CD)"
          fi
          
          JSON_PAYLOAD=$(jq -n \
            --arg username "${{ github.repository }} (CI/CD)" \
            --arg title "$TITLE" \
            --argjson color "$COLOR" \
            --arg repo "${{ github.repository }}" \
            --arg status "${{ job.status }}" \
            --arg commit "$COMMIT_MSG" \
            --arg actor "${{ github.actor }}" \
            '{
              username: $username,
              avatar_url: "https://minhhan.net/wp-content/uploads/2026/09/cropped-Asset-6.png",
              embeds: [{
                title: $title,
                color: $color,
                description: ("Dự án: **" + $repo + "**\nKết quả: **" + $status + "**\nNội dung: **" + $commit + "**\nThực hiện bởi: **" + $actor + "**")
              }]
            }')
          
          curl -H "Content-Type: application/json" -d "$JSON_PAYLOAD" ${{ secrets.DISCORD_WEBHOOK_URL }}
